# Canonical site mapping — cross-source location graph
# Links ERP customer/site numbers, Smartti property IDs, and KONE building names
# to a single canonical_site_id used in Silver/Gold layers.
schema_version: "0.1.0"
default_timezone: Europe/Helsinki

# Mapping policy:
# - Rows without a match emit site_id = NULL and mapping_status = 'unmapped' (never dropped)
# - ERP sites use customer_no + customer_site_no as composite key
# - Smartti uses property_id (internal) and file_slug (filename stem)
# - KONE uses kone_building (display name from export filename)

sites:
  # --- Valmet ERP sites (real customer data) ---

  - canonical_site_id: site_valmet_l11
    display_name: Lentokentänkatu 11
    customer_name: Valmet Technologies Oy
    address: Lentokentänkatu 11, 33900 Tampere
    city: Tampere
    country: FI
    timezone: Europe/Helsinki
    erp:
      customer_no: 100000413
      customer_site_no: 998389833
    smartti:
      property_id: null
      file_slug: null
    kone:
      building_name: null
    data_sources: [erp_alarms, erp_work_orders, erp_maintenance_plans, cleaning_utilization]
    notes: Primary cross-domain demo site — ERP + room utilization

  - canonical_site_id: site_valmet_venttiilitehdas
